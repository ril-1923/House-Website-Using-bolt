<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homestead Haven - Properties</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" >
  <link rel="stylesheet" href="properties.css">
</head>
<body class="properties-page">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/pages/home.html">Homestead Haven</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="properties.html">Properties</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="page-header py-5">
    <div class="container text-center">
      <h1>Our Properties</h1>
      <p>Browse our curated collection of exceptional homes</p>
    </div>
  </section>

  <section class="filter-bar py-3">
    <div class="container">
      <div class="row align-items-center g-3">
        <div class="col-md-3">
          <select class="form-select" id="filterType">
            <option value="all">All Types</option>
            <option value="house">House</option>
            <option value="apartment">Apartment</option>
            <option value="villa">Villa</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="filterBedrooms">
            <option value="all">Any Bedrooms</option>
            <option value="2">2+</option>
            <option value="3">3+</option>
            <option value="4">4+</option>
          </select>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="filterPrice">
            <option value="all">Any Price</option>
            <option value="500000">Under $500K</option>
            <option value="750000">Under $750K</option>
            <option value="1000000">Under $1M</option>
          </select>
        </div>
        <div class="col-md-3">
          <button class="btn filter-btn w-100" id="resetFilters">Reset Filters</button>
        </div>
      </div>
    </div>
  </section>

  <section class="properties-listing py-4">
    <div class="container">
      <div class="row g-4" id="propertyGrid">
        <!-- Properties rendered by JS -->
      </div>
    </div>
  </section>

  <footer class="site-footer py-4 text-center">
    <div class="container">
      <p>&copy; 2026 Homestead Haven. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/pages/properties.js"></script>
</body>
</html>
